name: CD - Deploy Databases

on:
  push:
    branches: [ develop, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform-cluster:
    name: Deploy - RDS Cluster
    uses: ./.github/workflows/_reusable-terraform.yml
    with:
      working_directory: "."
      auto_apply: true
      workspace: 'dev'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  terraform-databases:
    name: Deploy - Databases and Tables
    uses: ./.github/workflows/_reusable-terraform.yml
    needs: terraform-cluster
    with:
      working_directory: "sql"
      auto_apply: true
      var_file: ${{ github.ref == 'refs/heads/main' && 'environments/prod.tfvars' || 'environments/dev.tfvars' }}
      workspace: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}