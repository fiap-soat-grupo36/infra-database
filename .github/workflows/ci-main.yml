name: CI - Terraform

on:
  push:
    branches: [ develop, main, feature/**, hotfix/** ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  checks: write
  pull-requests: write

jobs:
  terraform-cluster:
    name: CI - RDS Cluster
    uses: ./.github/workflows/_reusable-terraform.yml
    with:
      working_directory: "."
      auto_apply: false
      workspace: 'dev'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  terraform-databases:
    name: CI - Databases and Tables
    uses: ./.github/workflows/_reusable-terraform.yml
    needs: terraform-cluster
    with:
      working_directory: "sql"
      auto_apply: false
      var_file: ${{ github.ref == 'refs/heads/main' && 'environments/prod.tfvars' || 'environments/dev.tfvars' }}
      workspace: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  create_pr_to_develop:
    name: Create PR to Develop
    uses: ./.github/workflows/_reusable-create-pr.yml
    needs: [terraform-cluster, terraform-databases]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feature/' ) || startsWith(github.ref, 'refs/heads/hotfix/'))
    with:
      base: develop
