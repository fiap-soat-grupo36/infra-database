name: CD - Develop

on:
  push:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform-cluster:
    name: Deploy - RDS Cluster
    uses: ./.github/workflows/_reusable-terraform.yml
    with:
      working_directory: "."
      auto_apply: true
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  terraform-databases:
    name: Deploy - Databases and Tables (DEV)
    uses: ./.github/workflows/_reusable-terraform.yml
    needs: terraform-cluster
    with:
      working_directory: "sql"
      auto_apply: true
      var_file: "environments/dev.tfvars"
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  create_pr_to_main:
    name: Create PR to Main
    uses: ./.github/workflows/_reusable-create-pr.yml
    needs: [terraform-cluster, terraform-databases]
    if: success()
    with:
      base: main
      head: develop
